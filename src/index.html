  <!--
    WHY NO <link rel="preload"> FOR IMAGES HERE:
    ─────────────────────────────────────────────
    Preloading images via <link rel="preload"> only works when the browser
    can match the preload to an actual resource request. There are two cases
    where the match FAILS and the browser fires a "preloaded but not used" warning:

    1. CSS background-image  → browser can't link preload to a CSS url() reference.
       The hero BG is a CSS background; preloading it here does nothing.
       Fix: hero BG is now a real <img> tag (position:absolute) in the component —
            fetchpriority="high" is set directly on that <img>, which is the correct LCP API.

    2. Angular lazy-loaded components → Angular bootstraps after this HTML is parsed.
       Any <img> inside a lazy-loaded component is not in the DOM yet, so the browser
       marks the preloaded resource as "unused" and wastes the early network slot.
       Fix: fetchpriority="high" + loading="eager" on the <img> itself (already done).

    Both fixes are applied in home.component.html and navbar.component.html.
    Do NOT add preload tags here for Angular component images.
  -->
