<header class="navbar" [class.scrolled]="isScrolled()">
  <!-- Top bar -->
  <div class="navbar-topbar">
    <div class="container topbar-inner">
      <div class="topbar-info">
        <a href="tel:0506512422" class="topbar-item">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
            <path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/>
          </svg>
          0506512422
        </a>
        <a href="tel:0507751708" class="topbar-item">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
            <path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/>
          </svg>
          0507751708
        </a>
        <a href="mailto:goldenkey89@hotmail.com" class="topbar-item">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
            <path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
          </svg>
          goldenkey89&#64;hotmail.com
        </a>
      </div>
      <div class="topbar-badge">
        <span class="badge-dot"></span>
        Emergency 24/7
      </div>
    </div>
  </div>

  <!-- Main nav -->
  <div class="navbar-main">
    <div class="container main-inner">

      <!-- Logo -->
      <a routerLink="/" class="navbar-logo" (click)="closeMenu()">
        <div class="logo-icon">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
            <path d="M12 1C8.676 1 6 3.676 6 7c0 2.296 1.261 4.29 3.125 5.373L9 20h6l-.125-7.627C16.739 11.29 18 9.296 18 7c0-3.324-2.676-6-6-6z" fill="#B8861B" opacity="0.2"/>
            <path d="M12 2C9.243 2 7 4.243 7 7s2.243 5 5 5 5-2.243 5-5-2.243-5-5-5zm0 7.5c-1.379 0-2.5-1.121-2.5-2.5S10.621 4.5 12 4.5 14.5 5.621 14.5 7 13.379 9.5 12 9.5z" fill="#B8861B"/>
            <rect x="10" y="12" width="4" height="8" rx="1" fill="#3A3A3A"/>
            <rect x="9" y="17" width="2.5" height="1.5" rx="0.5" fill="#B8861B"/>
          </svg>
        </div>
        <div class="logo-text">
          <span class="logo-main">GOLDEN<span class="logo-key">KEY</span></span>
          <span class="logo-sub">Lock Repairing EST</span>
        </div>
      </a>

      <!-- Desktop links -->
      <nav class="navbar-links">
        @for (link of navLinks; track link.path) {
          <a
            [routerLink]="link.path"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: link.path === '/' }"
            class="nav-link"
          >
            {{ link.label }}
          </a>
        }
      </nav>

      <!-- CTA -->
      <a href="tel:0506512422" class="btn btn-gold navbar-cta">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
          <path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/>
        </svg>
        Call Now
      </a>

      <!-- Hamburger -->
      <button class="hamburger" (click)="toggleMenu()" [class.open]="menuOpen()" aria-label="Toggle menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>

  <!-- Mobile menu -->
  <div class="mobile-menu" [class.open]="menuOpen()">
    <nav class="mobile-links">
      @for (link of navLinks; track link.path) {
        <a
          [routerLink]="link.path"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: link.path === '/' }"
          class="mobile-link"
          (click)="closeMenu()"
        >
          {{ link.label }}
        </a>
      }
    </nav>
    <div class="mobile-contact">
      <a href="tel:0506512422" class="btn btn-gold">📞 0506512422</a>
      <a href="tel:0507751708" class="btn btn-outline">📞 0507751708</a>
    </div>
  </div>
</header>

<!-- Spacer so content doesn't hide under fixed navbar -->
<div class="navbar-spacer"></div>
