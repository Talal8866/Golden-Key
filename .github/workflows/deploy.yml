name: Build and Deploy to Hostinger

on:
  push:
    branches:
      - main # Triggers the deploy when you push to the main branch

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4

    - name: ⚙️ Use Node.js
      uses: actions/setup-node@v4
      with:
        node-node-version: '20' # Matches your local Node version
        cache: 'npm'

    - name: 📦 Install dependencies
      run: npm ci

    - name: 🏗️ Build Project
      run: npm run build

    - name: 📂 Sync Files to Hostinger via FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        # Point this to your compiled Angular production folder:
        local-dir: ./dist/golden-key/browser/
        # Uploads to the root folder on Hostinger:
        server-dir: /public_html/