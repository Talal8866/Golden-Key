# Golden Key Lock Repairing EST — Nginx Configuration
# Copy to /etc/nginx/sites-available/goldenkeydubai.com and symlink to sites-enabled

server {
    listen 80;
    server_name goldenkeydubai.com www.goldenkeydubai.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name goldenkeydubai.com www.goldenkeydubai.com;

    root /var/www/goldenkeydubai/dist/golden-key/browser;
    index index.html;

    # SSL (use Certbot / Let's Encrypt)
    ssl_certificate     /etc/letsencrypt/live/goldenkeydubai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/goldenkeydubai.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;

    # ── Security Headers ──────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://maps.googleapis.com https://maps.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://images.unsplash.com https://maps.googleapis.com https://maps.gstatic.com https://lh3.googleusercontent.com; frame-src https://www.google.com https://maps.google.com; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self';" always;

    # ── Gzip Compression (SPEED) ──────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/x-javascript text/xml application/xml image/svg+xml;
    gzip_comp_level 6;

    # ── Static Asset Caching (SPEED) ─────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── HTML: no-cache for fresh Angular routes ───
    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
    }

    # ── Angular Router: all routes → index.html ───
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Block sensitive files ─────────────────────
    location ~ /\. { deny all; }
    location ~* \.(env|git|htaccess|htpasswd)$ { deny all; }
}